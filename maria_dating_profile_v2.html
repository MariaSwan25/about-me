<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #FDF9F6;
    --ink: #4A3540;
    --sand: #D4CBB3;
    --blush: #D1A7A0;
    --pink: #CE96A6;
    --deep: #CE84AD;
    --muted: #B8AAA8;
    --light: #FAF4F6;
    --sand-light: #F5F1EA;
  }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    font-weight: 300;
  }
  .page { max-width: 680px; margin: 0 auto; padding: 0 0 80px; animation: fadeIn 1s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  /* LANG SWITCHER */
  .lang-switcher {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 500;
    background: rgba(253,249,246,0.92);
    border: 1px solid var(--sand);
    border-radius: 100px;
    padding: 7px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 14px rgba(206,132,173,0.18);
  }
  .lang-btn {
    background: none;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    transition: color 0.2s;
  }
  .lang-btn.active { color: var(--deep); }
  .lang-sep { color: var(--sand); font-size: 13px; }

  /* HERO */
  .hero { display: grid; grid-template-columns: 1fr 1fr; min-height: 260px; border-radius: 0 0 28px 28px; overflow: hidden; }
  .hero-photo { background: var(--sand-light); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .hero-intro {
    background: linear-gradient(160deg, var(--blush) 0%, var(--deep) 100%);
    padding: 24px 26px 30px;
    display: flex; flex-direction: column; justify-content: flex-end;
    position: relative;
  }
  .hero-intro::before { content: '♡'; position: absolute; top: 22px; right: 24px; font-size: 18px; color: rgba(255,255,255,0.3); }
  .hero-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
  .hero-name { font-family: 'Lora', serif; font-size: 38px; font-weight: 300; line-height: 1.1; color: #fff; }

  /* STRIP */
  .strip { background: var(--cream); padding: 0 18px; display: flex; border-bottom: 1px solid var(--sand); }
  .strip-item { display: flex; flex-direction: column; gap: 4px; padding: 18px 14px; flex: 1; }
  .strip-val { font-family: 'Lora', serif; font-size: 15px; font-weight: 400; color: var(--deep); }
  .strip-key { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .strip-div { width: 1px; background: var(--sand); align-self: stretch; margin: 12px 0; }

  /* SECTIONS */
  .section { padding: 42px 28px 0; }
  .section-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pink); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--sand); }

  /* ABOUT */
  .about-text { font-family: 'Lora', serif; font-size: 20px; font-weight: 300; line-height: 1.72; color: var(--ink); }
  .about-text em { font-style: italic; color: var(--deep); }

  /* INTERESTS */
  .interests-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .interest-card {
    background: #fff; padding: 20px 20px;
    border-left: 2px solid var(--sand);
    border-radius: 0 18px 18px 0;
    box-shadow: 0 3px 16px rgba(206,132,173,0.08);
  }
  .interest-card h4 { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .interest-card p { font-family: 'Lora', serif; font-size: 16px; color: var(--ink); font-weight: 400; line-height: 1.5; }

  /* VALUES */
  .values-list { display: flex; flex-direction: column; }
  .value-row { display: flex; align-items: baseline; gap: 16px; padding: 15px 0; border-bottom: 1px solid var(--sand-light); }
  .value-num { font-family: 'Lora', serif; font-size: 13px; color: var(--pink); min-width: 18px; font-style: italic; }
  .value-text { font-size: 15px; color: var(--ink); line-height: 1.55; }
  .value-text strong { font-weight: 500; color: var(--deep); }

  /* DREAMS */
  .dreams-block {
    background: linear-gradient(140deg, var(--blush) 0%, var(--deep) 100%);
    margin: 42px 28px 0; padding: 34px 30px;
    border-radius: 22px; position: relative;
  }
  .dreams-block::before { content: '✦'; position: absolute; top: 22px; right: 26px; font-size: 20px; color: rgba(255,255,255,0.22); }
  .dreams-label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.6); margin-bottom: 16px; }
  .dreams-text { font-family: 'Lora', serif; font-size: 21px; font-weight: 300; font-style: italic; color: #fff; line-height: 1.68; }

  /* LOOKING FOR */
  .looking-block {
    background: var(--sand-light);
    margin: 42px 28px 0; padding: 34px 30px;
    border-top: 2px solid var(--sand);
    border-radius: 22px; position: relative;
  }
  .looking-block::before { content: '♡'; position: absolute; top: 22px; right: 26px; font-size: 26px; color: var(--blush); opacity: 0.45; }
  .looking-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--deep); margin-bottom: 14px; }
  .looking-text { font-family: 'Lora', serif; font-size: 19px; font-weight: 300; color: var(--ink); line-height: 1.68; margin-bottom: 18px; }
  .looking-qualities { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
  .quality-tag { background: #fff; border: 1px solid var(--blush); color: var(--deep); font-size: 12px; padding: 7px 18px; border-radius: 100px; }

  /* WELCOME */
  .welcome-block {
    margin: 30px 28px 0; padding: 30px 30px;
    background: #fff;
    border-left: 3px solid var(--sand);
    border-radius: 0 22px 22px 0;
    box-shadow: 0 3px 20px rgba(206,132,173,0.09);
    position: relative;
  }
  .welcome-block::after { content: '✦'; position: absolute; bottom: 20px; right: 24px; font-size: 13px; color: var(--sand); }
  .welcome-title { font-family: 'Lora', serif; font-size: 21px; font-weight: 400; color: var(--deep); margin-bottom: 18px; line-height: 1.3; }
  .welcome-block p { font-size: 15px; line-height: 1.82; color: var(--ink); }
  .welcome-block p + p { margin-top: 11px; }
  .welcome-block em { color: var(--deep); font-style: italic; }

  /* GALLERY */
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .gallery-cell { background: var(--sand-light); aspect-ratio: 1; position: relative; overflow: hidden; cursor: pointer; border-radius: 16px; transition: transform 0.25s ease, opacity 0.2s; }
  .gallery-cell:hover { transform: scale(1.02); opacity: 0.9; }
  .gallery-cell:first-child { grid-column: span 2; aspect-ratio: 2/1; }
  .gallery-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* CONTACT FORM */
  .contact-form-block {
    margin: 42px 28px 0; padding: 34px 30px;
    background: #fff;
    border-left: 3px solid var(--sand);
    border-radius: 0 22px 22px 0;
    box-shadow: 0 3px 20px rgba(206,132,173,0.09);
    position: relative;
  }
  .contact-form-block::after { content: '♡'; position: absolute; top: 28px; right: 30px; font-size: 22px; color: var(--blush); opacity: 0.4; }
  .contact-form-block .form-title { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--pink); margin-bottom: 24px; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .form-group input { width: 100%; padding: 13px 18px; border: 1px solid var(--sand); background: var(--cream); font-family: 'Nunito', sans-serif; font-size: 15px; color: var(--ink); outline: none; border-radius: 12px; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--deep); }
  .form-group input::placeholder { color: var(--muted); font-weight: 300; }
  .form-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--pink), var(--deep)); color: #fff; border: none; font-family: 'Nunito', sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; margin-top: 10px; border-radius: 12px; transition: opacity 0.2s; }
  .form-submit:hover { opacity: 0.85; }
  .form-success { display: none; text-align: center; padding: 18px; font-size: 16px; color: var(--deep); font-family: 'Lora', serif; font-style: italic; }

  /* FOOTER */
  .footer { padding: 44px 28px 0; display: flex; align-items: center; justify-content: center; }
  .footer-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); animation: pulse 2.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.25;transform:scale(0.5)} }

  /* DECORATIVE */
  .deco-divider { text-align: center; padding: 22px 0 0; color: var(--blush); font-size: 14px; letter-spacing: 12px; opacity: 0.7; user-select: none; }
  .footer-hearts { text-align: center; padding: 28px 0 0; font-size: 16px; color: var(--blush); letter-spacing: 14px; opacity: 0.6; animation: pulse 3s ease-in-out infinite; user-select: none; }
  .site-credit { text-align: center; padding: 28px 28px 8px; font-size: 11px; color: var(--muted); font-style: italic; line-height: 1.7; }

  /* LIGHTBOX */
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(74,53,64,0.93); z-index: 1000; align-items: center; justify-content: center; }
  .lightbox.active { display: flex; }
  .lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 14px; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 28px; cursor: pointer; opacity: 0.7; line-height: 1; }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-prev, .lightbox-next { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 32px; cursor: pointer; opacity: 0.6; padding: 16px; user-select: none; }
  .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; }
  .lightbox-prev { left: 12px; }
  .lightbox-next { right: 12px; }
  .lightbox-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.45); font-size: 12px; letter-spacing: 0.1em; }

  /* MOBILE */
  @media (max-width: 600px) {
    html { font-size: 17px; }
    .page { padding: 0 0 44px; }
    .hero { grid-template-columns: 1fr; min-height: auto; }
    .hero-photo { min-height: 300px; }
    .hero-intro { padding: 24px 20px 26px; }
    .hero-name { font-size: 44px; }
    .strip { flex-wrap: wrap; gap: 0; padding: 0 10px; }
    .strip-item { width: 50%; padding: 14px 12px; }
    .strip-div { display: none; }
    .strip-val { font-size: 14px; }
    .welcome-block { margin: 20px 16px 0; padding: 24px 20px; }
    .welcome-title { font-size: 19px; }
    .welcome-block p { font-size: 16px; }
    .section { padding: 32px 16px 0; }
    .about-text { font-size: 19px; }
    .value-text { font-size: 16px; }
    .interests-grid { grid-template-columns: 1fr; }
    .interest-card p { font-size: 17px; }
    .dreams-block, .looking-block, .contact-form-block { margin: 26px 16px 0; padding: 24px 20px; }
    .dreams-text { font-size: 20px; }
    .looking-text { font-size: 18px; }
    .quality-tag { font-size: 14px; padding: 8px 16px; }
    .form-group input { font-size: 16px; padding: 14px 16px; }
    .form-submit { font-size: 15px; padding: 16px; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .gallery-cell:first-child { grid-column: span 2; }
    .gallery-cell { border-radius: 12px; }
    .footer { padding: 30px 16px 0; }
    .site-credit { padding: 26px 16px 8px; font-size: 12px; }
    .lightbox-prev, .lightbox-next { font-size: 44px; padding: 12px 16px; }
    .lightbox-close { top: 14px; right: 16px; font-size: 36px; }
    .lang-switcher { top: 12px; right: 12px; }
  }
</style>

  function setLang(lang) {
    document.documentElement.lang = lang;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (i18n[lang][key] !== undefined) el.innerHTML = i18n[lang][key];
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.dataset.i18nPh;
      if (i18n[lang][key] !== undefined) el.placeholder = i18n[lang][key];
    });

    document.getElementById('btnRu').classList.toggle('active', lang === 'ru');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');

    localStorage.setItem('lang', lang);
  }

  // Init with saved or default language
  const savedLang = localStorage.getItem('lang') || 'en';
  setLang(savedLang);

  // LIGHTBOX
  const photos = ['picture_1.png','picture_3.png','picture_4.png','picture_5.png',
                  'picture_6.png','picture_8.png','picture_9.png','picture_10.png'];
  let current = 0;
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');

  function openLightbox(idx) {
    current = idx;
    lbImg.src = photos[current];
    lbCounter.textContent = (current + 1) + ' / ' + photos.length;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lb.classList.remove('active');
    document.body.style.overflow = '';
  }
  function showNext() { current = (current + 1) % photos.length; openLightbox(current); }
  function showPrev() { current = (current - 1 + photos.length) % photos.length; openLightbox(current); }

  document.querySelectorAll('.gallery-cell').forEach(cell => {
    cell.style.cursor = 'zoom-in';
    cell.addEventListener('click', () => openLightbox(+cell.dataset.idx));
  });
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', showNext);
  document.getElementById('lbPrev').addEventListener('click', showPrev);
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('active')) return;
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
    if (e.key === 'Escape') closeLightbox();
  });

  // FORM
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyZtyL0N9hNGhMlShgcWqLt58NMN9sIWWPWI2QcdcvRPy2t4UYzpkaIbSdUIAJOWbHi/exec';

  (function() {
    var f = document.createElement('iframe');
    f.style.display = 'none';
    f.src = SCRIPT_URL + '?action=view';
    document.body.appendChild(f);
    setTimeout(function() { document.body.removeChild(f); }, 5000);
  })();

  document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = this;
    const data = new FormData(form);
    data.set('whatsapp', (data.get('whatsapp') || '').replace(/\+/g, ''));
    if (!(data.get('instagram') || '').trim()) data.set('instagram', 'blank');
    if (!(data.get('comment') || '').trim()) data.set('comment', 'blank');
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = SCRIPT_URL + '?' + new URLSearchParams(data).toString();
    document.body.appendChild(iframe);
    setTimeout(function() { document.body.removeChild(iframe); }, 5000);
    form.style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
  });
</script>
